[project]
name = "machine-learning"
version = "0.1.0"
description = "Twenty machine-learning projects on public data, each built around the mistake that makes it wrong."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.5"]

[dependency-groups]
# ruff is pinned to a minor range, not ">=": the *formatter* changes between minor
# versions, so an open bound means CI reformats differently from whatever version the
# code was committed with and the Lint step fails on untouched files.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Paired axis calls read better on one line: `ax.grid(axis="x"); ax.grid(axis="y", visible=False)`
# is one visual decision, and splitting it across two lines buries the pairing.
"projects/*/run.py" = ["E702"]
